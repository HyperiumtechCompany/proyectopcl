[package]
name = "dialux_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nalgebra = "0.32.3"
ndarray = "0.15.6"
console_error_panic_hook = { version = "0.1.7", optional = true }
dxf = "0.6.1"
uuid = { version = "1.23.0", features = ["v4", "js"] }

[features]
default = ["console_error_panic_hook"]
